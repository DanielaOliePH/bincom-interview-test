
{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm p-4">
    <h4 class="mb-3">Question 3: Add New Polling Unit & Store All Party Results</h4>
    <form method="POST" class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Select LGA</label>
            <select name="lga_id" id="lgaSelect" class="form-select" required>
                <option value="">-- Choose LGA --</option>
                {% for lga in lgas %}
                <option value="{{ lga.lga_id }}">{{ lga.lga_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">Select Ward</label>
            <select name="ward_id" id="wardSelect" class="form-select" disabled required>
                <option value="">-- Choose LGA First --</option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label">Polling Unit Number</label>
            <input type="text" name="pu_number" class="form-control" placeholder="e.g. DT0101001" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Polling Unit Name</label>
            <input type="text" name="pu_name" class="form-control" placeholder="e.g. Central Primary School" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Entered By (Your Name)</label>
            <input type="text" name="entered_by" class="form-control" required>
        </div>

        <h5 class="mt-4">Enter Party Scores</h5>
        {% for p in parties %}
        <div class="col-md-3">
            <label class="form-label fw-bold">{{ p.partyname }}</label>
            <input type="number" name="score_{{ p.partyname }}" class="form-control" min="0" value="0" required>
        </div>
        {% endfor %}

        <div class="col-12 mt-4">
            <button type="submit" class="btn btn-primary">Save Polling Unit & All Results</button>
        </div>
    </form>
</div>

<script>
document.getElementById("lgaSelect").addEventListener("change", function() {
    const lgaId = this.value;
    const wardSelect = document.getElementById("wardSelect");
    wardSelect.innerHTML = '<option value="">Loading...</option>';
    if (!lgaId) return;

    fetch(`/api/wards/${lgaId}`)
        .then(res => res.json())
        .then(data => {
            wardSelect.innerHTML = '<option value="">-- Choose Ward --</option>';
            data.forEach(w => wardSelect.innerHTML += `<option value="${w.ward_id}">${w.ward_name}</option>`);
            wardSelect.disabled = false;
        });
});
</script>
{% endblock %}
